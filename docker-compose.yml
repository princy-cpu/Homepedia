# Homepedia : stack lakehouse locale
#   docker compose up -d                   -> services du cœur
#   docker compose --profile bi up -d      -> + Superset
#   docker compose --profile api up -d     -> + FastAPI
#   docker compose run --rm tools <cmd>    -> ingestion / dbt / NLP

x-spark-env: &spark-env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: us-east-1
  ICEBERG_URI: http://iceberg-rest:8181
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
  PYTHONPATH: /opt/homepedia/src

services:
  # ---------- Stockage objet (S3) ----------
  minio:
    # Les images officielles minio/minio ne sont plus publiées depuis octobre 2025
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  # ---------- Catalogue Iceberg ----------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD}
      # Persistance du catalogue (sinon il est perdu à chaque redémarrage)
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg.db
      AWS_REGION: us-east-1
    ports: ["8181:8181"]
    volumes: [iceberg-catalog:/catalog]
    depends_on: [minio]

  # ---------- Cluster Spark ----------
  spark-master:
    build: ./docker/spark
    image: homepedia/spark:latest
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    env_file: .env
    environment: *spark-env
    ports: ["8080:8080", "7077:7077", "4040:4040"]
    volumes:
      - ./src:/opt/homepedia/src
      - ./config:/opt/homepedia/config
      - ./notebooks:/opt/homepedia/notebooks

  spark-worker-1: &worker
    image: homepedia/spark:latest
    pull_policy: never          # image construite par spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    ports: ["8081:8081"]
    volumes:
      - ./src:/opt/homepedia/src
      - ./config:/opt/homepedia/config
    depends_on: [spark-master]

  spark-worker-2:
    <<: *worker
    ports: ["8082:8081"]

  # ---------- Moteur SQL ----------
  trino:
    image: trinodb/trino:${TRINO_VERSION:-476}
    ports: ["8085:8080"]
    volumes: [./docker/trino/catalog:/etc/trino/catalog]
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on: [iceberg-rest, postgres]

  # ---------- Bases de données ----------
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: homepedia
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro

  # ---------- Python : app, outils, API ----------
  app:
    build: ./docker/python
    image: homepedia/python:latest
    command: ["streamlit", "run", "src/app/Home.py", "--server.address=0.0.0.0"]
    env_file: .env
    environment: *spark-env
    ports: ["8501:8501"]
    volumes: [./:/opt/homepedia]
    depends_on: [postgres, mongo]

  tools:
    image: homepedia/python:latest
    pull_policy: never          # image construite par app
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *spark-env
      DBT_PROFILES_DIR: /opt/homepedia/dbt
    volumes: [./:/opt/homepedia]
    entrypoint: []
    command: ["bash"]

  api:
    image: homepedia/python:latest
    pull_policy: never
    profiles: ["api"]
    env_file: .env
    command: ["uvicorn", "homepedia.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *spark-env
    ports: ["8000:8000"]
    volumes: [./:/opt/homepedia]
    depends_on: [postgres, mongo]

  # ---------- BI (bonus) ----------
  superset:
    build: ./docker/superset
    profiles: ["bi"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    ports: ["8088:8088"]
    volumes: [superset-data:/app/superset_home]
    depends_on: [trino]

volumes:
  minio-data:
  iceberg-catalog:
  pg-data:
  mongo-data:
  superset-data:
